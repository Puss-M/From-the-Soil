<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>风物志数据大屏</title>
  <link rel="stylesheet" href="/dashboard-style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
  <div id="screen">
    <div class="main-title">中国传统民居风物志</div>
    
    <div class="chart-panel" style="left: 60px; top: 150px; width: 500px; height: 350px;">
      <div id="chart1" style="width: 100%; height: 100%;"></div>
    </div>
    
    <div class="chart-panel" style="left: 600px; top: 150px; width: 700px; height: 600px;">
      <div id="map" style="width: 100%; height: 100%;"></div>
    </div>
    
    <div class="chart-panel" style="right: 60px; top: 150px; width: 500px; height: 350px;">
      <div id="chart2" style="width: 100%; height: 100%;"></div>
    </div>
  </div>
  
  <script>
    // 自适应缩放
    function resize() {
      const screen = document.getElementById('screen');
      const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      screen.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
    }
    window.addEventListener('resize', resize);
    resize();
    
    // 示例图表
    const chart1 = echarts.init(document.getElementById('chart1'));
    chart1.setOption({
      backgroundColor: 'transparent',
      tooltip: {
        backgroundColor: 'rgba(255, 253, 248, 0.95)',
        borderColor: '#8b5a2b',
        textStyle: { color: '#3a3028' }
      },
      xAxis: {
        type: 'category',
        data: ['寒冷', '温和', '炎热', '潮湿', '干燥'],
        axisLabel: { color: '#5a4a3a' }
      },
      yAxis: {
        type: 'value',
        axisLabel: { color: '#5a4a3a' },
        splitLine: { lineStyle: { color: 'rgba(90, 74, 58, 0.1)' } }
      },
      series: [{
        data: [320, 432, 301, 334, 390],
        type: 'bar',
        itemStyle: {
          color: {
            type: 'linear',
            x: 0, y: 0, x2: 0, y2: 1,
            colorStops: [
              { offset: 0, color: '#8b5a2b' },
              { offset: 1, color: 'rgba(139, 90, 43, 0.3)' }
            ]
          }
        }
      }]
    });
    
    const chart2 = echarts.init(document.getElementById('chart2'));
    chart2.setOption({
      backgroundColor: 'transparent',
      tooltip: {
        backgroundColor: 'rgba(255, 253, 248, 0.95)',
        borderColor: '#8b5a2b',
        textStyle: { color: '#3a3028' }
      },
      series: [{
        type: 'pie',
        radius: ['40%', '70%'],
        data: [
          { value: 335, name: '木结构' },
          { value: 310, name: '砖石结构' },
          { value: 234, name: '土木结构' },
          { value: 135, name: '混合结构' }
        ],
        label: { color: '#5a4a3a' },
        itemStyle: {
          color: function(params) {
            const colors = ['#8b5a2b', '#b8864f', '#9d8b6a', '#5a7a52'];
            return colors[params.dataIndex % colors.length];
          }
        }
      }]
    });
    
    // 地图占位
    const mapChart = echarts.init(document.getElementById('map'));
    mapChart.setOption({
      backgroundColor: 'transparent',
      title: {
        text: '地图区域',
        left: 'center',
        top: 'middle',
        textStyle: { color: '#5a4a3a', fontSize: 24 }
      }
    });
  </script>
</body>
</html>
